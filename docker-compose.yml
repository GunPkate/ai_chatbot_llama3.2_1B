services:
  backend:
    build: .
    ports:
      - "8080:8080"
    models:
      llm:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_NAME

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

models:
  llm:
    model: ai/llama3.2:1B-Q8_0